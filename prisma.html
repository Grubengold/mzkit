<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisma-Modell — Mensch · Technologie · Organisation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #2A1D16;
    --ink-soft: rgba(42,29,22,0.66);
    --ink-faint: rgba(42,29,22,0.34);
    --grain-mono: 'JetBrains Mono', monospace;
    --grain-sans: 'Space Grotesk', sans-serif;

    --bg-pink:   #E7C9DE;
    --bg-peach:  #EBC9A3;
    --bg-green:  #D7DFB0;
    --bg-blue:   #A9C9D6;

    --c-mensch:   #4F7A93;
    --c-tech:     #93812E;
    --c-org:      #B15A4A;
    --c-mt:       #6C8C4E;
    --c-to:       #B87A3E;
    --c-mo:       #8A5E8C;
    --c-zentrum:  #5C4A3A;
  }

  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%; color:var(--ink); font-family:var(--grain-sans);
    background: #FFFFFF;
    /*
    background:
      radial-gradient(95% 85% at 15% 15%,
        var(--bg-pink) 0%, rgba(231,201,222,0.5) 40%, rgba(231,201,222,0.15) 70%, rgba(231,201,222,0) 100%),
      radial-gradient(95% 85% at 85% 15%,
        var(--bg-peach) 0%, rgba(235,201,163,0.5) 40%, rgba(235,201,163,0.15) 70%, rgba(235,201,163,0) 100%),
      radial-gradient(100% 90% at 15% 88%,
        var(--bg-green) 0%, rgba(215,223,176,0.5) 40%, rgba(215,223,176,0.15) 70%, rgba(215,223,176,0) 100%),
      radial-gradient(105% 95% at 88% 88%,
        var(--bg-blue) 0%, rgba(169,201,214,0.5) 40%, rgba(169,201,214,0.15) 70%, rgba(169,201,214,0) 100%),
      #F2ECE3;
    */
  }

  .topbar {
    position: relative; z-index: 3;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding: 22px 44px 0 44px;
  }
  .eyebrow { font-family:var(--grain-mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); }
  h1 { margin:4px 0 0 0; font-size: clamp(18px,2.2vw,24px); font-weight:600; letter-spacing:-.01em; }
  .rev { font-family:var(--grain-mono); font-size:11px; color:var(--ink-faint); text-align:right; line-height:1.6; }

  .layout {
    position: relative; z-index: 2;
    display: flex;
    height: calc(100vh - 72px);
    margin-top: 10px;
  }

  /* ---------- left: fixed triangle + independently scrolling text ---------- */
  .left {
    width: 42%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 22px 40px 26px 40px;
    height: 100%;
    overflow: hidden;
  }
  .tri-wrap { flex: 0 0 auto; width: min(330px, 70%); margin-top: 6px; }
  .tri-wrap svg { width: 100%; height: auto; overflow: visible; }
  .tri-edge { fill:none; stroke: var(--ink-faint); stroke-width: 2; transition: stroke .3s ease, stroke-width .3s ease; }
  .tri-node { font-family: var(--grain-sans); font-weight: 700; font-size: 23px; fill: var(--ink); transition: fill .3s ease; }
  .tri-underline { stroke-width: 2.4; opacity: 0; transition: opacity .3s ease, stroke .3s ease; }

  .focus-readout {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    max-width: 420px;
    margin-top: 22px;
    overflow-y: auto;
    padding-right: 14px;
    text-align: left;
    scrollbar-width: thin;
    scrollbar-color: var(--ink-faint) transparent;
  }
  .focus-readout::-webkit-scrollbar { width: 4px; }
  .focus-readout::-webkit-scrollbar-thumb { background: var(--ink-faint); border-radius: 2px; }

  .focus-group { font-family: var(--grain-mono); font-size: 11px; letter-spacing:.1em; text-transform:uppercase; color: var(--ink-faint); transition: color .3s ease; }
  .focus-title { font-size: clamp(19px,2.1vw,24px); font-weight: 700; margin: 6px 0 14px 0; transition: color .3s ease; line-height: 1.25; }
  .focus-text p { font-size: 13.5px; line-height: 1.65; color: var(--ink-soft); margin: 0 0 12px 0; }
  .focus-text b { font-family: var(--grain-mono); font-size: 10.5px; letter-spacing:.06em; text-transform:uppercase; color: var(--ink); display:block; margin-bottom: 3px; font-weight:600; }
  .triade { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--ink-faint); }
  .triade p { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.55; color: var(--ink-soft); margin: 0 0 10px 0; }
  .triade p:last-child { margin-bottom: 0; }
  .tri-sym { flex: 0 0 18px; font-size: 15px; line-height: 1.5; color: var(--ink-faint); text-align: center; }

  /* ---------- right scroll list ---------- */
  .right { width: 58%; position: relative; overflow: hidden; }

  .list-scroll {
    height:100%; overflow-y:scroll; scrollbar-width:none; padding: 0 48px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
  }
  .list-scroll::-webkit-scrollbar { display:none; }

  .heading {
    font-family: var(--grain-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 34px 0 6px 0;
    opacity: .9;
  }
  .heading.is-first { padding-top: 0; }

  .row {
    padding: 3px 0;
    font-size: 15px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: color .2s ease;
  }
  .row:hover { color: var(--ink); }
  .row.selected { color: var(--ink); font-weight: 600; }

  .loop-divider {
    height: 1px;
    background: var(--ink-faint);
    opacity: .35;
    margin: 26px 0;
    width: 100%;
  }

  .titleblock { position:fixed; z-index:4; right:44px; bottom:22px; font-family:var(--grain-mono); font-size:10px; color:var(--ink-faint); text-align:right; line-height:1.7; }
  .titleblock a { text-decoration: underline; }

  @media (max-width: 900px) {
    .layout { flex-direction: column; height: auto; }
    .left { width: 100%; height: auto; padding: 10px 24px 0 24px; }
    .tri-wrap { width: 190px; }
    .focus-readout { max-height: 34vh; }
    .right { width: 100%; height: 52vh; }
    .titleblock { display:none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div>
      <div class="eyebrow"><a href="index.html" style="color:inherit; text-decoration:none;">Grubengold</a> — Analyse-Prisma</div>
    </div>
  </div>

  <div class="layout">
    <div class="left">
      <div class="tri-wrap">
        <svg viewBox="0 -10 300 245">
          <line id="edge-mt" class="tri-edge" x1="150" y1="20" x2="35" y2="190" />
          <line id="edge-to" class="tri-edge" x1="150" y1="20" x2="265" y2="190" />
          <line id="edge-mo" class="tri-edge" x1="35" y1="190" x2="265" y2="190" />
          <text id="node-tech" class="tri-node" x="150" y="6" text-anchor="middle">Technologie</text>
          <text id="node-mensch" class="tri-node" x="4" y="224" text-anchor="start">Mensch</text>
          <text id="node-org" class="tri-node" x="296" y="224" text-anchor="end">Organisation</text>
          <line id="underline-tech" class="tri-underline" x1="108" y1="13" x2="192" y2="13" />
          <line id="underline-mensch" class="tri-underline" x1="4" y1="231" x2="70" y2="231" />
          <line id="underline-org" class="tri-underline" x1="182" y1="231" x2="296" y2="231" />
          <text id="node-job" class="tri-node" x="150" y="133" text-anchor="middle">Job</text>
          <line id="underline-job" class="tri-underline" x1="138" y1="140" x2="162" y2="140" />
        </svg>
      </div>
      <div class="focus-readout" id="focus-readout">
        <div class="focus-group" id="focus-group">Technologie</div>
        <div class="focus-title" id="focus-title">Daten</div>
        <div class="focus-text" id="focus-text"></div>
      </div>
    </div>

    <div class="right">
      <div class="list-scroll" id="list-scroll"></div>
    </div>
  </div>

  <div class="titleblock">
    Grubengold · Menschenzentrierte KI-Transformation<br>
    Made with ♥ in Bochum · v0.2 · Stand August 2026<br>

  </div>

  <script>
const GROUP_META = {
  zentrum:{ label: "Arbeitsaufgabe",             color: "var(--c-zentrum)",node: "node-job",    underline: "underline-job" },
  tech:   { label: "Technologie",               color: "var(--c-tech)",   node: "node-tech",   underline: "underline-tech" },
  mensch: { label: "Mensch",                    color: "var(--c-mensch)", node: "node-mensch", underline: "underline-mensch" },
  org:    { label: "Organisation",               color: "var(--c-org)",    node: "node-org",    underline: "underline-org" },
  mt:     { label: "Mensch ∩ Technologie",       color: "var(--c-mt)",     edge: "edge-mt", nodes: ["node-mensch", "node-tech"] },
  to:     { label: "Technologie ∩ Organisation", color: "var(--c-to)",     edge: "edge-to", nodes: ["node-tech", "node-org"] },
  mo:     { label: "Mensch ∩ Organisation",      color: "var(--c-mo)",     edge: "edge-mo", nodes: ["node-mensch", "node-org"] },
};

const ITEMS = [
  {g:"zentrum", t:"Aufgabenzuschnitt",
    kern:"Welche Aufgaben es gibt, wie sie gebündelt sind, ob sie ganzheitlich bleiben oder zu Restaufgaben zerfallen. Der Zuschnitt entscheidet, <em>was</em> die Aufgabe ist, bevor die Funktionsteilung (M × T) entscheidet, wer welchen Teil übernimmt.",
    v:"Sind Aufgaben erfasst und beschrieben, bevor über KI entschieden wird?", w:"Entstehen ganze, sinnvolle Aufgaben, die Wert erzeugen, statt Restarbeit?", k:"Wird der Zuschnitt regelmäßig neu verhandelt, wenn sich Fähigkeiten verschieben?"},
  {g:"zentrum", t:"Gelebtes Arbeitshandeln",
    kern:"Was tatsächlich getan wird, nicht was vorgesehen ist: reale Nutzung, Prüfroutinen, Umgehungen, Schatten-Nutzung, Transparenz über eigenen KI-Einsatz. Anders als alle übrigen Subdimensionen ist dies kein Gestaltungsobjekt, sondern der Realitätstest: Hier liest man ab, ob der Rest des Rahmens trägt.",
    v:"Gibt es Sichtbarkeit über die reale Nutzung?", w:"Zeigt das reale Handeln, dass Gestaltung angenommen wird, oder Umgehung?", k:"Fließen Beobachtungen aus der Praxis als Signal in die Anpassung des Rahmens?"},
  {g:"mensch", t:"Haltung",
    kern:"Die grundsätzliche emotionale und bewertende Beziehung zur KI: Neugier oder Abwehr, Zuversicht oder Angst. Generelle Disposition; aufgabenbezogenes Vertrauen ist dagegen eine Frage der Urteilsfähigkeit und der Interaktionsgestaltung.",
    v:"Ist Offenheit als Startbedingung da, sind Sorgen bekannt und aussprechbar?", w:"Trägt die Haltung produktive Nutzung, weder Verweigerung noch blinde Euphorie?", k:"Bleibt Offenheit über Enttäuschungen und Modellwechsel hinweg erhalten?"},
  {g:"mensch", t:"Kompetenz & Urteilsfähigkeit",
    kern:"Verstehen, was KI kann und was nicht, und Ergebnisse fachlich beurteilen können. Das setzt fachliche Substanz voraus: Wer die Sache nicht versteht, kann den Output nicht prüfen. Eingeschlossen ist die Fähigkeit und die Gewohnheit, mit technologischen Weiterentwicklungen mitzuwachsen, die individuelle Seite dessen, was die Lernarchitektur (Organisation) auf Systemebene leistet.",
    v:"Sind KI-Grundverständnis, fachliche Substanz sowie Zeit und Zugang zum Lernen vorhanden?", w:"Werden Outputs im Alltag tatsächlich beurteilt und korrigiert, und führt Lernen zu veränderter Praxis, nicht nur zu Zertifikaten?", k:"Wächst die Urteilsfähigkeit mit neuen Systemfähigkeiten mit statt zu erodieren, und ist Mitwachsen zur Gewohnheit geworden?"},
  {g:"mensch", t:"Berufliche Identität",
    kern:"Die Frage nach dem eigenen Wertbeitrag, wenn Aufgaben und Fachwissen, die bisher Teil der beruflichen Selbstverständlichkeit waren, auch von KI geleistet werden. Verlangt Sinngebung, nicht Training.",
    v:"Ist die Identitätsfrage anerkannt und hat sie Raum?", w:"Können Menschen ihren Wertbeitrag im neuen Zuschnitt sehen und ausfüllen?", k:"Können sich berufliche Selbstverständnisse mitentwickeln, statt an alten Rollenbildern zu brechen?"},
  {g:"mt", t:"Funktionsteilung",
    kern:"Die konkrete Aufteilung einer Aufgabe zwischen Person und System, nachdem der Aufgabenzuschnitt (Zentrum) entschieden hat, was die Aufgabe ist: Wer entscheidet, wer prüft, wer führt aus. Ob der Mensch Akteur bleibt oder zum Restmonitor wird.",
    v:"Ist die Teilung explizit entschieden statt gewachsen?", w:"Liegt das Urteil dort, wo es Wert stiftet, bleibt der Mensch Akteur?", k:"Wird die Teilung regelmäßig überprüft und verschoben, wenn sich die Fähigkeitsgrenze bewegt?"},
  {g:"mt", t:"Interaktionsgestaltung",
    kern:"Die Gestaltung des unmittelbaren Zusammenspiels zwischen Person und System. Nutzer bilden ihr mentales Modell einer KI fast ausschließlich aus der Oberfläche: Wie souverän ein System formuliert, prägt die Erwartung an seine Verlässlichkeit stärker als jede Dokumentation. Interaktion ist deshalb kein Komfortthema, sondern der Ort, an dem realistische Erwartungen entstehen oder verhindert werden.",
    v:"Sind Grenzen und Unsicherheit überhaupt sichtbar gemacht?", w:"Kalibriert der Umgang das Vertrauen, finden Widerspruch und Korrektur real statt?", k:"Wird die Gestaltung bei neuen Modellen neu geprüft und lernt sie aus Fehlern?"},
  {g:"mt", t:"Kognitiver Schutz",
    kern:"Schutz in zwei Richtungen: vor kognitiver Belastung durch die KI-Nutzung selbst und vor dem Verlernen. Ob der Denkprozess dort geschützt wird, wo er das Wertvolle ist, und ob genug Eigenleistung erhalten bleibt, damit Urteilsfähigkeit nicht erodiert.",
    v:"Ist bekannt, welche Fähigkeiten erhalten bleiben müssen und wo Belastung entsteht?", w:"Ist Prüfen leistbar, überfordern Menge und Tiefe nicht?", k:"Bleibt Übung erhalten, damit künftige Beurteilung möglich bleibt?"},
  {g:"tech", t:"Daten",
    kern:"Die Informationsgrundlage, auf der KI überhaupt arbeiten kann. Daten sind der Teil der Technologie, der sich am wenigsten beschaffen lässt: Modelle kann man kaufen, die eigene Datenlage ist Ergebnis jahrelanger Praxis. Deshalb entscheidet sie meist vor jeder Werkzeugauswahl darüber, was möglich ist und was nicht.",
    v:"Verfügbar, zugänglich, gut genug?", w:"Tragen die Daten die konkreten Anwendungsfälle?", k:"Wachsen Bestände und Qualität mit neuen Anforderungen mit, und fließen Nutzungssignale zurück?"},
  {g:"tech", t:"Modelle & Stack",
    kern:"Modelle, Werkzeuge und Plattform, das Wissen über deren Leistungsprofil und dessen Grenzen sowie die Austauschbarkeit der Bausteine. Modularität ist dabei keine Kür, sondern Konstruktionsanforderung: Nur wenn Komponenten hinter stabilen Abstraktionsschichten austauschbar bleiben, sind technische Entscheidungen revidierbar.",
    v:"Ist eine passende Basis vorhanden, ihr Leistungsprofil bekannt und die Architektur in austauschbare Bausteine geschnitten?", w:"Leistet der Stack in den realen Aufgaben, was er soll, und ist ein Wechsel im Alltag ohne Großprojekt möglich?", k:"Wird das Leistungsprofil bei jedem Wechsel neu vermessen statt fortgeschrieben, und bleibt Austauschbarkeit über wachsende Integrationen hinweg erhalten? (Technikseitiger Ankerpunkt der K-Frage.)"},
  {g:"tech", t:"Technische Sicherheit & Robustheit",
    kern:"Wie sich das System verhält, wenn es nicht wie vorgesehen läuft. Gegenüber klassischer Software verschiebt sich der Schwerpunkt: Der harte Ausfall ist seltener das Problem als die plausibel aussehende Fehlleistung an den Rändern der Leistungsfähigkeit. Datenschutz gehört in die Konstruktion, nicht in die Abnahme.",
    v:"Ist das Schutzniveau definiert und gebaut?", w:"Hält das System im Betrieb, auch an den Rändern?", k:"Werden neue Risiken neuer Modelle laufend bewertet, also Sicherheit als Prozess statt als Abnahme?"},
  {g:"to", t:"Verortung von KI-Systemen",
    kern:"Der strukturelle Status eines KI-Systems in der Organisation. Zwischen Werkzeug, Prozessschritt und eigenständigem Knoten liegen große Unterschiede in Zuständigkeit, Kontrolle und Erwartung, und der Status wird meist implizit vergeben, häufig über Sprache: Wer von einem Agenten als „Kollegen\" spricht, hat eine strukturelle Entscheidung getroffen, ohne sie zu treffen. (Wie sich die Struktur selbst verändert, ist Aufbauorganisation.)",
    v:"Ist der Modus (Werkzeug, Prozessschritt, Knoten) pro System entschieden?", w:"Funktionieren Auftrag, Prüfung und Eskalation im Betrieb?", k:"Kann die Verortung wechseln, wenn Systeme fähiger werden, ohne Bruch?"},
  {g:"to", t:"Regulatorische Konformität & Nachweisbarkeit",
    kern:"Die Fähigkeit, das eigene KI-Handeln gegenüber Dritten zu belegen: Aufsicht, Kunden, Betriebsrat, Gericht. Diese Fähigkeit fällt nicht mit der Absicht zusammen, sondern muss technisch gebaut und organisational gepflegt werden. Weil sie nur entsteht, wenn beide Seiten dasselbe meinen, liegt sie an der Schnittstelle und nicht in einer Dimension.",
    v:"Sind Anforderungen bekannt und ist Protokollierung technisch gebaut?", w:"Ist Auskunft real möglich und im Ernstfall erprobt?", k:"Passen sich Nachweise an neue Regeln und neue Systemklassen an?"},
  {g:"to", t:"Anbieterabhängigkeit",
    kern:"Ob Beschaffungsentscheidungen Wechselfähigkeit erhalten oder verspielen. Die organisationale Seite der technischen Austauschbarkeit (Modelle & Stack): technisch möglicher Wechsel nützt nichts, wenn Verträge und Integrationen ihn verhindern.",
    v:"Sind Abhängigkeiten bekannt und dokumentiert?", w:"Tragen die Konditionen den Betrieb, ohne kritische Erpressbarkeit?", k:"Ist der Ausstieg real möglich, sodass die Abhängigkeit die Ko-Evolution nicht begrenzt?"},
  {g:"org", t:"Strategie & Leitplanken",
    kern:"Wofür KI da ist, was sie übernehmen soll und was bewusst nicht. Wofür gewonnene Freiräume genutzt werden. Leitplanken sind generische, fallunabhängige Grenzen (z. B. „keine KI bei Personalentscheidungen\"). Sie sind zu unterscheiden von den fallspezifischen Gestaltungsprinzipien der Heuristiken (Säule 2).",
    v:"Sind Zweck und Tabus entschieden und bekannt?", w:"Ist die Reinvestition entschieden, erzeugen Gewinne Wert statt stiller Verdichtung?", k:"Werden Strategie und Leitplanken revidiert, wenn sich Fähigkeiten ändern?"},
  {g:"org", t:"Governance",
    kern:"Die formale Verfassung der Entscheidungsfindung: wer darf entscheiden, wer gibt frei, wer haftet. Bei KI wird das anspruchsvoller, weil Ergebnisse nicht deterministisch sind und der formal Zuständige oft nicht derjenige ist, der die Herleitung prüfen kann. Governance regelt die Papierlage; ob Zuständigkeit auch als tragbar erlebt wird, ist eine Frage der Rollen (O × M).",
    v:"Ist Verantwortung benannt, sind Wege definiert?", w:"Wirken Gates vor der Wirkung, und fallen Entscheidungen zügig?", k:"Wird Governance mit neuen Systemklassen (z. B. Agenten) weiterentwickelt statt nur ergänzt?"},
  {g:"org", t:"Aufbauorganisation",
    kern:"Der Bauplan der Organisation: wie tief die Hierarchie reicht, wie Einheiten geschnitten sind, wie weit Information und Entscheidung voneinander entfernt liegen. Für die KI-Transformation ist die Struktur nicht der Behälter, in den Lösungen einsortiert werden, sondern selbst Gegenstand der Gestaltung, weil KI klassische Kontroll- und Aggregationsfunktionen verschiebt.",
    v:"Ist die Struktur bekannt und als gestaltbar akzeptiert?", w:"Ermöglicht sie schnelle Entscheidungen dort, wo Kontextwissen sitzt?", k:"Verändert sich die Struktur selbst mit, die Organisation als Mitentwickelnde?"},
  {g:"org", t:"Prozesse",
    kern:"Der Weg, den Arbeit durch die Organisation nimmt. Für den KI-Einsatz zählt weniger, dass ein Ablauf schneller werden kann, als dass er anders geschnitten werden muss: KI verändert, wo Prüfpunkte sinnvoll liegen und wie viele Übergaben nötig sind. Ein unveränderter Ablauf beschleunigt mit KI auch seine Schwächen.",
    v:"Sind Abläufe erfasst und Prüfschritte definiert?", w:"Erzeugen die Abläufe Qualität, nicht nur Geschwindigkeit?", k:"Werden Prozesse neu geschnitten, wenn sich die Funktionsteilung verschiebt?"},
  {g:"org", t:"Anreiz- & Bewertungssysteme",
    kern:"Die Signale, die der Organisation sagen, welches Verhalten sich lohnt. Sie wirken zuverlässiger als Appelle und Richtlinien und geraten beim KI-Einsatz leicht in Widerspruch zur Absicht: Messbar ist zuerst die Nutzung, wertvoll ist der Beitrag, und wo Menge belohnt wird, entsteht Menge.",
    v:"Sind Messgrößen definiert, die Wertbeitrag erfassen können?", w:"Lohnt sich das richtige Verhalten tatsächlich?", k:"Werden Messgrößen angepasst, wenn KI-Anteile wachsen, statt alte Metriken fortzuschreiben?"},
  {g:"org", t:"Lernarchitektur",
    kern:"Der Apparat, mit dem die Organisation herausfindet, was funktioniert: Feedbackwege aus der Praxis in Entscheidungen, Experimentierräume, Testfälle und systematische Auswertung, Abbruchfähigkeit von Initiativen. Anders als Prozesse (wie Arbeit fließt) beschreibt die Lernarchitektur die Infrastruktur der Erkenntnisgewinnung. Die organisationale Seite dessen, was Kompetenz & Urteilsfähigkeit (Mensch) individuell leistet.",
    v:"Existieren Testfälle, Experimentierräume und Auswertungswege?", w:"Erreichen Erkenntnisse die Entscheidungen, schnell genug?", k:"Lernt die Organisation systematisch aus jedem Zyklus?"},
  {g:"org", t:"Beteiligung & Transparenz",
    kern:"Der Zugang der Mitarbeitenden zu den Entscheidungen, die ihre Arbeit verändern, und die Offenheit der Organisation über ihre Absichten. Beides ist kein Stimmungsmanagement: Wer die Arbeit macht, weiß am genauesten, wo eine Lösung tragen wird, und ungeklärte Absichten werden nicht ignoriert, sondern durch Vermutungen ersetzt.",
    v:"Existieren Mitwirkungswege, sind Absichten ausgesprochen?", w:"Verändert Beteiligung tatsächlich Lösungen, entsteht Vertrauen?", k:"Bleiben Menschen auch bei fortlaufender Veränderung einbezogen, nicht nur beim ersten Rollout?"},
  {g:"mo", t:"Rollen",

    kern:"Der Spielraum, in dem Menschen über ihr eigenes Vorgehen entscheiden. KI kann ihn erweitern, indem sie Routine abnimmt, oder verengen, indem sie Abläufe vorgibt und Verhalten messbar macht. Welche der beiden Wirkungen eintritt, ist eine Gestaltungsfrage und keine Eigenschaft der Technologie.",

    kern:"Die ungeschriebenen Regeln, unter denen KI-Einsatz stattfindet. Sie entscheiden darüber, ob Unsicherheiten, Fehler und die eigene Nutzung besprechbar sind, und damit darüber, wie viel die Organisation über ihren tatsächlichen KI-Einsatz überhaupt erfährt. Die informelle Seite der Organisation, wie sie bei den Menschen ankommt.",

    kern:"Die Rolle der Führungskraft in einem Wandel, der kein Zielbild hat. Wo Fachwissen an Exklusivität verliert und Entscheidungen algorithmisch vorbereitet werden, verschiebt sich Führung von der besseren Antwort zur Gestaltung des Kontexts, in dem Antworten entstehen und geprüft werden.",

const N = ITEMS.length;
const listEl = document.getElementById('list-scroll');
const focusReadoutEl = document.getElementById('focus-readout');
const focusRows = [];
const blockEls = [];

for (let copy = 0; copy < 3; copy++) {
  const block = document.createElement('div');
  block.className = 'block';
  let prevGroup = null;
  ITEMS.forEach((item, i) => {
    if (item.g !== prevGroup) {
      const h = document.createElement('div');
      h.className = 'heading';
      if (copy === 0 && i === 0) h.classList.add('is-first');
      h.textContent = GROUP_META[item.g].label;
      h.style.color = GROUP_META[item.g].color;
      block.appendChild(h);
      prevGroup = item.g;
    }
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.realIndex = i;
    row.textContent = item.t;
    row.addEventListener('click', () => {
      selectItem(i);
      row.scrollIntoView({ block: 'center', behavior: 'smooth' });
    });
    block.appendChild(row);
    focusRows.push(row);
  });
  listEl.appendChild(block);
  blockEls.push(block);

  const mark = document.createElement('div');
  mark.className = 'loop-divider';
  listEl.appendChild(mark);
}

let blockHeight = 0;
let ticking = false;

function measure() {
  blockHeight = blockEls[2].offsetTop - blockEls[1].offsetTop;
  listEl.scrollTop = blockEls[1].offsetTop;
}

function checkLoop() {
  if (listEl.scrollTop < blockHeight * 0.5) listEl.scrollTop += blockHeight;
  else if (listEl.scrollTop > blockHeight * 1.5) listEl.scrollTop -= blockHeight;
}

let lastGroupKey = null;

function selectItem(index) {
  const item = ITEMS[index];
  const meta = GROUP_META[item.g];

  focusRows.forEach(r => r.classList.toggle('selected', Number(r.dataset.realIndex) === index));

  document.getElementById('focus-group').textContent = meta.label;
  document.getElementById('focus-group').style.color = meta.color;
  document.getElementById('focus-title').textContent = item.t;
  document.getElementById('focus-title').style.color = meta.color;
  document.getElementById('focus-text').innerHTML = `
    <p>${item.kern}</p>
    <div class="triade">
      <p><span class="tri-sym">▬</span>${item.v}</p>
      <p><span class="tri-sym">◈</span>${item.w}</p>
      <p><span class="tri-sym">∞</span>${item.k}</p>
    </div>
  `;
  focusReadoutEl.scrollTop = 0;

  if (item.g !== lastGroupKey) {
    lastGroupKey = item.g;
    Object.values(GROUP_META).forEach(m => {
      if (m.edge) {
        const el = document.getElementById(m.edge);
        el.style.stroke = 'var(--ink-faint)';
        el.style.strokeWidth = '2';
      }
      if (m.node) document.getElementById(m.node).style.fill = 'var(--ink)';
      if (m.underline) document.getElementById(m.underline).style.opacity = '0';
    });
    if (meta.edge) {
      const el = document.getElementById(meta.edge);
      el.style.stroke = meta.color;
      el.style.strokeWidth = '3.4';
    }
    if (meta.node) document.getElementById(meta.node).style.fill = meta.color;
    if (meta.nodes) meta.nodes.forEach(id => { document.getElementById(id).style.fill = meta.color; });
    if (meta.underline) {
      const ul = document.getElementById(meta.underline);
      ul.style.stroke = meta.color;
      ul.style.opacity = '1';
    }
  }
}

listEl.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => { checkLoop(); ticking = false; });
    ticking = true;
  }
});

window.addEventListener('load', () => { measure(); selectItem(0); });
window.addEventListener('resize', measure);
</script>
